name: Pull request checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-analyze:
    name: Test and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check OpenAPI spec is up to date
        # Regenerate public/openapi.json and fail if it differs from the
        # committed copy, so the checked-in spec never drifts from the routes.
        run: |
          npm run openapi
          if ! git diff --quiet -- public/openapi.json; then
            echo "::error::public/openapi.json is stale. Run 'npm run openapi' and commit the result."
            git --no-pager diff -- public/openapi.json
            exit 1
          fi
