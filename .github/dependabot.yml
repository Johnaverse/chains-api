# Dependabot version updates. The github-actions ecosystem is what keeps the
# SHA-pinned workflow actions current: Dependabot understands `uses: repo@<sha> # vX.Y.Z`
# and proposes reviewed PRs that bump the SHA and the version comment together —
# without it, pinned actions would silently age.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
